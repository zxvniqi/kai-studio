plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.zxvniqi.naistudio'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.zxvniqi.naistudio'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('SIGN_STORE') ?: 'missing.p12')
            storeType 'pkcs12'
            storePassword System.getenv('SIGN_PASS')
            keyAlias 'nai'
            keyPassword System.getenv('SIGN_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
