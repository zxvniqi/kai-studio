name: Build APK

on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create signing key once (kept in repo so updates install over the old app)
        run: |
          if [ ! -f android/release.jks ]; then
            keytool -genkeypair -v -keystore android/release.jks -storepass naistudio -keypass naistudio \
              -alias nai -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=NAI Studio"
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git add android/release.jks
            git commit -m "Add APK signing key [skip ci]"
            git push
          fi

      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk nai-studio.apk
          gh release delete app -y --cleanup-tag || true
          gh release create app nai-studio.apk --title "NAI Studio 앱 (build ${{ github.run_number }})" --notes "안드로이드 앱 설치 파일" --latest
